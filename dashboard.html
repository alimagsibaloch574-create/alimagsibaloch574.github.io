<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg">

<h1><i class="fa fa-university"></i> Bank Dashboard</h1>

<div class="container">

<div class="box">
    <h2><i class="fa fa-user-plus"></i> Create Account</h2>
    <form action="/create" method="post">
        <input type="text" name="name" placeholder="Name" required>
        <input type="text" name="acc_no" placeholder="Account Number" required>
        <button>Create</button>
    </form>
</div>

<div class="box">
    <h2><i class="fa fa-money-bill"></i> Deposit</h2>
    <form action="/deposit" method="post">
        <input type="text" name="acc_no" placeholder="Account Number" required>
        <input type="number" name="amount" placeholder="Amount" required>
        <button>Deposit</button>
    </form>
</div>

<div class="box">
    <h2><i class="fa fa-credit-card"></i> Withdraw</h2>
    <form action="/withdraw" method="post">
        <input type="text" name="acc_no" placeholder="Account Number" required>
        <input type="number" name="amount" placeholder="Amount" required>
        <button>Withdraw</button>
    </form>
</div>

</div>

<h2>📊 Accounts</h2>
<ul>
{% for acc, data in accounts.items() %}
    <li><i class="fa fa-user"></i> {{data.name}} | {{acc}} | 💰 {{data.balance}}</li>
{% endfor %}
</ul>

</body>
</html>
